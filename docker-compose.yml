services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dexbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dexbot}
      POSTGRES_DB: dexbot
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexbot -d dexbot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Applies database migrations once, then exits. The backend waits for it.
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DEXBOT_DATABASE_URL: postgresql+asyncpg://dexbot:${POSTGRES_PASSWORD:-dexbot}@postgres:5432/dexbot
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}

  backend:
    build: ./backend
    env_file: .env
    environment:
      DEXBOT_DATABASE_URL: postgresql+asyncpg://dexbot:${POSTGRES_PASSWORD:-dexbot}@postgres:5432/dexbot
      DEXBOT_REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped

volumes:
  pgdata:
